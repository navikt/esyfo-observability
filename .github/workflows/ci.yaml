name: Verify

on:
  pull_request:
  push:
    branches: [main]
  merge_group:

permissions:
  contents: read

concurrency:
  group: verify-${{ github.ref }}
  cancel-in-progress: true

jobs:
  node:
    name: Node and packed npm consumer
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      packages: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '24'
          cache: pnpm
          registry-url: https://npm.pkg.github.com
      - name: Install dependencies without executing package scripts or hooks
        run: pnpm install --frozen-lockfile --ignore-scripts --ignore-pnpmfile
        env:
          NODE_AUTH_TOKEN: ${{ github.token }}
      - name: Prepare esbuild without registry credentials
        run: pnpm rebuild esbuild --ignore-pnpmfile
      - run: pnpm check:contracts
      - run: pnpm typecheck
      - run: pnpm test
      - run: node --test .github/scripts/release.test.mjs
      - run: pnpm build
      - run: pnpm pack:check

  jvm:
    name: JVM consumer on Java ${{ matrix.java }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        java: ['21', '25']
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6.0.1
        with:
          distribution: temurin
          java-version: |
            21
            ${{ matrix.java }}
      - uses: gradle/actions/setup-gradle@9c971963bec38e04b3d30dcc455b5382be2fdbfb # v6
        with:
          cache-read-only: ${{ github.ref != 'refs/heads/main' }}
      - name: Check library and staged Maven consumer
        working-directory: jvm
        run: ./gradlew check -PtestJavaVersion="$TEST_JAVA_VERSION"
        env:
          TEST_JAVA_VERSION: ${{ matrix.java }}
